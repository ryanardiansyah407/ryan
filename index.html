<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    SELMA ACC BANDUNG
  </title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="card">
      <h2 id="total-sku">0</h2>
      <p>Total SKU</p>
    </div>

    <div class="card">
      <h2 id="with-image">0</h2>
      <p>Sudah Ada Foto</p>
    </div>

    <div class="card">
      <h2 id="without-image">0</h2>
      <p>Belum Ada Foto</p>
    </div>

  </div>



  <!-- FILTER -->
  <div class="filter-box">

    <button onclick="filterSKU('all')">
      Semua
    </button>

    <button onclick="filterSKU('with-image')">
      Sudah Ada Foto
    </button>

    <button onclick="filterSKU('without-image')">
      Belum Ada Foto
    </button>

  </div>

  <div id="filter-result"></div>



  <!-- MAIN BOX -->
  <div class="box">

    <h1>
      Upload Foto Produk
    </h1>



    <!-- SEARCH -->
    <div class="search-box">

      <input
        type="text"
        id="sku"
        placeholder="Cari SKU"
        autocomplete="off">

      <div id="suggestions"></div>

    </div>



    <!-- BUTTON -->
    <button onclick="addSKU()">
      Tambah SKU
    </button>



    <!-- SKU LIST -->
    <div id="sku-container"></div>



    <!-- UPLOAD -->
    <div
      class="upload-box"
      id="drop-area">

      <div class="upload-icon">
        📤
      </div>

      <h2>
        Upload Foto
      </h2>

      <p>
        Drag & Drop Foto
      </p>

      <span>
        atau klik memilih file
      </span>

      <input
        type="file"
        id="image"
        hidden
        multiple
        accept="image/*">

    </div>



    <!-- PREVIEW -->
    <img id="preview">



    <!-- BULK -->
    <div id="bulk-preview"></div>



    <!-- OLD -->
    <h3>Foto Lama</h3>

    <img id="old-preview">



    <!-- ACTION -->
    <div class="button-group">

      <button onclick="uploadImage()">
        Upload
      </button>

      <button onclick="deleteImage()">
        Hapus Foto
      </button>

    </div>



    <!-- STATUS -->
   <div class="progress-container">

  <div
    class="progress-bar"
    id="progress-bar">
  </div>

</div>

<p id="status"></p>

  </div>



  <!-- JS -->
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="dashboard.js"></script>
  <script src="search.js"></script>
  <script src="sku.js"></script>
  <script src="upload.js"></script>
  <script src="filter.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>





  

</body>
</html>
